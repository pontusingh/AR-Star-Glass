; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; 1. 串口监视器和烧录波特率设置
monitor_speed = 115200
upload_speed = 115200

; 2. 开启 8MB PSRAM 支持 (ESP32-S3-WROOM-1-N16R8 采用的是 OPI 接口的 PSRAM)
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DBOARD_HAS_PSRAM
    ; loopTask 栈 8K→16K：天文引擎软浮点调用链深（CalcMoon 单帧约1KB）+ printf 浮点，
    ; 默认 8192 在首次刷新可见目标表时栈溢出重启。注意宏名必须是 ARDUINO_LOOP_STACK_SIZE，
    ; 用 CONFIG_ARDUINO_LOOP_STACK_SIZE 会被框架预编译 sdkconfig.h 重定义回 8192。
    -DARDUINO_LOOP_STACK_SIZE=16384

; 3. 配置 16MB Flash 闪存大小及分区表
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 4. OLED 依赖 (U8g2 在 OLED 阶段加入)
lib_deps = olikraus/U8g2@^2.36.0